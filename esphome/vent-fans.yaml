# Vent booster fans - Raspberry Pi Pico W on the vent_fans carrier PCB.
#
# GP15 drives the SI2302CDS (Q1) low-side buck at 40 kHz. Thanks to L1/C3 the fans get
# smooth DC (about duty x 5 V) instead of chopped 5 V, so the speed setting
# really changes fan speed and the fans stay quiet (see ../sim).
#
# Home Assistant decides when the fans run (homeassistant/automation.yaml).
# Manual override, highest priority first:
#   1. ON-OFF-ON toggle on J6: up = force on, down = force off, centre = AUTO
#   2. "Mode" select in Home Assistant: Auto / Force on / Force off
#   3. AUTO: the fan entity, driven by the HA automation
# The DS18B20 duct probe on J5 reports the duct air temperature to HA and lets
# the board run the fans by itself whenever Home Assistant is unreachable.
#
# One board per vent: copy this file per vent and change the two substitutions.

substitutions:
  name: vent-fans               # e.g. vent-fans-living -> entity fan.vent_fans_living
  friendly_name: Vent Fans
  # Duct-probe fallback (used only while HA is unreachable), in deg C
  duct_hot: "32.0"              # >= 90 F: furnace is heating -> fans on
  duct_cold: "16.0"             # <= 61 F: AC is cooling      -> fans on
  duct_idle_low: "18.0"         # between 64 F and 81 F: blower off -> fans off
  duct_idle_high: "27.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

rp2:
  board: rpipicow

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s        # don't reboot every 15 min when HA is down; the fallback below handles it

ota:
  - platform: esphome
    encryption:
      key: !secret ota_key

# --- Fan drive -------------------------------------------------------------
globals:
  - id: target_level        # what the fan component asked for (0..1)
    type: float
    initial_value: "0.0"
  - id: actual_level        # what GP15 is outputting right now
    type: float
    initial_value: "0.0"

output:
  - platform: rp2040_pwm    # the real pin; only the slew limiter below writes to it
    id: pwm_hw
    pin: GPIO15
    frequency: 40000Hz

  - platform: template      # what the fan component drives
    id: fan_out
    type: float
    # 5 V fans usually stall below ~2.5 V. Speed 1 % maps to min_power, 100 % to
    # full 5 V. Raise min_power if your fans don't start at low speed.
    min_power: 0.55
    max_power: 1.0
    zero_means_zero: true
    write_action:
      - lambda: id(target_level) = state;

# --- Manual override -------------------------------------------------------
# J6: switch common to pin 2 (GND), ON lug to pin 1 (GP18), OFF lug to pin 3 (GP17).
binary_sensor:
  - platform: gpio
    id: sw_force_on
    name: Override switch on
    pin:
      number: GPIO18
      mode: {input: true, pullup: true}
      inverted: true
    filters:
      - delayed_on_off: 50ms
  - platform: gpio
    id: sw_force_off
    name: Override switch off
    pin:
      number: GPIO17
      mode: {input: true, pullup: true}
      inverted: true
    filters:
      - delayed_on_off: 50ms

select:
  - platform: template
    id: mode
    name: Mode
    options: [Auto, Force on, Force off]
    initial_option: Auto
    optimistic: true
    restore_value: true

number:
  - platform: template
    id: manual_speed
    name: Manual speed
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true

text_sensor:
  - platform: template
    name: Control source
    update_interval: 2s
    lambda: |-
      if (id(sw_force_on).state) return {"Switch: ON"};
      if (id(sw_force_off).state) return {"Switch: OFF"};
      auto i = id(mode).active_index();
      if (i.has_value() && *i == 1) return {"HA: Force on"};
      if (i.has_value() && *i == 2) return {"HA: Force off"};
      return {"Auto"};

# Slew limiter (soft start): moves the PWM at most 2 % every 20 ms, so
# 0 -> 100 % takes 1 s. Without it, switching straight on rings the L1/C3 filter
# and pulls a ~2 A spike through L1 (simulated); with it, the peak is ~0.45 A.
# It also applies the override: the fan entity keeps what HA asked for, but the
# fans follow the switch / Mode while an override is active.
interval:
  - interval: 20ms
    then:
      - lambda: |-
          const float step = 0.02f;
          // same 1..100 % -> min_power..1.0 mapping as fan_out above
          float manual = 0.55f + 0.45f * id(manual_speed).state / 100.0f;
          if (std::isnan(manual)) manual = 1.0f;
          float t = id(target_level);
          auto i = id(mode).active_index();
          if (id(sw_force_on).state) t = manual;
          else if (id(sw_force_off).state) t = 0.0f;
          else if (i.has_value() && *i == 1) t = manual;
          else if (i.has_value() && *i == 2) t = 0.0f;
          float a = id(actual_level);
          if (a < t) a = std::min(t, a + step);
          else if (a > t) a = std::max(t, a - step);
          if (a != id(actual_level)) {
            id(actual_level) = a;
            id(pwm_hw).set_level(a);
          }

  # Duct-probe fallback: only acts while Home Assistant is NOT connected. Duct
  # air is hot while heating and cold while cooling; near room temperature means
  # the blower is off. The gap between the on and off thresholds stops it
  # flapping. When HA comes back, the automation re-syncs the fans.
  - interval: 30s
    then:
      - if:
          condition:
            not:
              api.connected:
          then:
            - if:
                condition:
                  lambda: 'float t = id(duct_temp).state; return !std::isnan(t) && (t >= ${duct_hot} || t <= ${duct_cold});'
                then:
                  - fan.turn_on:
                      id: vent_fans
                      speed: 60
                else:
                  - if:
                      condition:
                        lambda: 'float t = id(duct_temp).state; return std::isnan(t) || (t > ${duct_idle_low} && t < ${duct_idle_high});'
                      then:
                        - fan.turn_off: vent_fans

fan:
  - platform: speed
    id: vent_fans
    output: fan_out
    name: None              # entity becomes fan.<name>, e.g. fan.vent_fans
    restore_mode: ALWAYS_OFF

# --- DS18B20 duct probe on J5 ----------------------------------------------
# Waterproof probe pushed through the duct wall a few inches upstream of the
# fans. Red = 3V3 (J5 pin 3), yellow = data (pin 2), black = GND (pin 1).
# If the probe is unplugged the sensor reads unavailable and the fallback
# simply keeps the fans off; nothing else depends on it.
one_wire:
  - platform: gpio
    pin: GPIO16

sensor:
  - platform: dallas_temp
    id: duct_temp
    name: Duct temperature
    update_interval: 15s
    filters:
      - filter_out: 85.0     # DS18B20 power-on value, not a real reading
