# Vent booster fans: STANDALONE "set and forget" firmware.
# No Wi-Fi, no Home Assistant. Same PCB as the smart version.
#
# How it decides:
#   The DS18B20 probe in the duct watches the supply air.
#   Fans ON  when the air is hotter than the heating threshold (furnace) or
#            colder than the cooling threshold (AC) for 20 s.
#   Fans OFF when the air has been back between the thresholds (minus a
#            2 deg C margin) for 60 s. The fans can't fool this: they move air
#            but can't make it hot or cold.
#
# Setting it up (once):
#   SPEED  : flip the override switch to ON, turn the SPEED trimpot until the
#            fans are as quiet as you like, flip back to the centre (AUTO).
#   LEARN  : while the furnace is heating, press LEARN once (LED blinks 3x).
#            In summer, while the AC is cooling, press LEARN once (LED blinks 2x).
#            Each sets that threshold halfway between the duct's resting
#            temperature and what it is now. Saved across power cuts.
#            Hold LEARN for 5 s to go back to the defaults (LED blinks 5x).
#            10 blinks means "not hot or cold enough to learn yet" (or no probe).
#
# Status LED:
#   off = idle, on = fans running, slow blink = no probe (fans stay off in AUTO).

substitutions:
  name: vent-fans-standalone
  heat_default: "32.0"     # deg C (90 F) until you press LEARN while heating
  cool_default: "16.0"     # deg C (61 F) until you press LEARN while cooling
  hysteresis: "2.0"        # deg C margin before turning off again
  on_delay_s: "20"         # seconds past a threshold before the fans start
  off_delay_s: "60"        # seconds back to normal before the fans stop

esphome:
  name: ${name}
  on_boot:
    priority: -100
    then:
      - lambda: id(boot_s) = 0;

rp2:
  # Any Pico works; set this to the board you plug in:
  #   rpipico   = Pico / Pico H (RP2040, no Wi-Fi)  <- cheapest, recommended here
  #   rpipicow  = Pico W / WH
  #   rpipico2  = Pico 2,  rpipico2w = Pico 2 W (RP2350)
  # All pins this firmware uses (GP10, 12, 15, 16, 17, 18, 26) are identical on
  # all four. It never touches GP23/24/25/29, which are internal and differ
  # between the W and non-W boards (on the W they run the Wi-Fi chip).
  board: rpipico

logger:                    # USB serial log, handy for checking temperatures

# ---- Inputs -------------------------------------------------------------------
one_wire:
  - platform: gpio
    pin: GPIO16            # J5, DS18B20 duct probe

sensor:
  - platform: dallas_temp
    id: duct_temp
    update_interval: 5s
    filters:
      - filter_out: 85.0   # DS18B20 power-on value, not a real reading
  - platform: adc
    id: speed_pot          # RV1 wiper, 0..3.3 V
    pin: GPIO26
    update_interval: 250ms
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1

binary_sensor:
  - platform: gpio         # override switch J6: up = force on
    id: sw_force_on
    pin: {number: GPIO18, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 50ms]
  - platform: gpio         # override switch J6: down = force off
    id: sw_force_off
    pin: {number: GPIO17, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 50ms]
  - platform: gpio         # SW2 LEARN button
    id: learn_btn
    pin: {number: GPIO12, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on_off: 30ms]
    on_click:
      - min_length: 30ms
        max_length: 1500ms
        then:
          - lambda: |-
              float t = id(duct_temp).state;
              float idle = id(idle_t);
              if (std::isnan(t) || !id(idle_ok)) { id(blink) = 20; return; }   // 10 blinks: can't learn
              if (t >= idle + 5.0f) {
                id(heat_thr) = (idle + t) / 2.0f;  id(blink) = 6;              // 3 blinks
                ESP_LOGI("learn", "heating threshold = %.1f C (idle %.1f, now %.1f)", id(heat_thr), idle, t);
              } else if (t <= idle - 4.0f) {
                id(cool_thr) = (idle + t) / 2.0f;  id(blink) = 4;              // 2 blinks
                ESP_LOGI("learn", "cooling threshold = %.1f C (idle %.1f, now %.1f)", id(cool_thr), idle, t);
              } else {
                id(blink) = 20;
                ESP_LOGW("learn", "duct %.1f C is too close to resting %.1f C to learn", t, idle);
              }
      - min_length: 5s
        max_length: 20s
        then:
          - lambda: |-
              id(heat_thr) = ${heat_default};
              id(cool_thr) = ${cool_default};
              id(blink) = 10;                                                   // 5 blinks
              ESP_LOGI("learn", "thresholds reset to defaults");

# ---- Outputs ------------------------------------------------------------------
output:
  - platform: rp2040_pwm   # Q1 gate: low-side buck, fans get smooth DC
    id: pwm_hw
    pin: GPIO15
    frequency: 40000Hz
  - platform: gpio         # D3 status LED
    id: status_led
    pin: GPIO10

# ---- State --------------------------------------------------------------------
globals:
  - {id: heat_thr,  type: float, restore_value: yes, initial_value: "${heat_default}"}
  - {id: cool_thr,  type: float, restore_value: yes, initial_value: "${cool_default}"}
  - {id: idle_t,    type: float, restore_value: no,  initial_value: "20.0"}  # duct resting temp (RAM only: no flash wear)
  - {id: idle_ok,   type: bool,  restore_value: no,  initial_value: "false"}
  - {id: running,   type: bool,  restore_value: no,  initial_value: "false"}
  - {id: on_count,  type: int,   restore_value: no,  initial_value: "0"}
  - {id: off_count, type: int,   restore_value: no,  initial_value: "0"}
  - {id: boot_s,    type: int,   restore_value: no,  initial_value: "0"}
  - {id: blink,     type: int,   restore_value: no,  initial_value: "0"}
  - {id: target_level, type: float, restore_value: no, initial_value: "0.0"}
  - {id: actual_level, type: float, restore_value: no, initial_value: "0.0"}

interval:
  # Controller, once a second
  - interval: 1s
    then:
      - lambda: |-
          id(boot_s)++;
          float t = id(duct_temp).state;
          bool have = !std::isnan(t);

          // Resting (idle) duct temperature: follow it slowly while the fans are
          // off and nothing is happening; never while heating/cooling runs.
          if (have && !id(running)) {
            if (!id(idle_ok)) {
              if (t > id(cool_thr) && t < id(heat_thr)) { id(idle_t) = t; id(idle_ok) = true; }
            } else if (t > id(cool_thr) + ${hysteresis} && t < id(heat_thr) - ${hysteresis}) {
              id(idle_t) += (t - id(idle_t)) / 1800.0f;      // ~30 min time constant
            }
          }

          // Heating / cooling detection with on and off delays
          if (!have) {
            id(running) = false; id(on_count) = 0; id(off_count) = 0;
          } else if (!id(running)) {
            bool active = (t >= id(heat_thr)) || (t <= id(cool_thr));
            id(on_count) = active ? id(on_count) + 1 : 0;
            if (id(on_count) >= ${on_delay_s}) { id(running) = true; id(off_count) = 0; }
          } else {
            bool back = (t < id(heat_thr) - ${hysteresis}) && (t > id(cool_thr) + ${hysteresis});
            id(off_count) = back ? id(off_count) + 1 : 0;
            if (id(off_count) >= ${off_delay_s}) { id(running) = false; id(on_count) = 0; }
          }

          // Speed from the trimpot: 0..100 % of the usable range. 0.55 of full
          // PWM (~2.7 V on the fans) is the lowest setting, so they always start.
          float pot = id(speed_pot).state / 3.3f;
          if (std::isnan(pot)) pot = 0.6f;
          pot = std::max(0.0f, std::min(1.0f, pot));
          float level = 0.55f + 0.45f * pot;

          // Override switch wins: ON = run at the trimpot speed (use it to set
          // the speed), OFF = stop, centre = AUTO.
          float tgt = id(running) ? level : 0.0f;
          if (id(sw_force_on).state) tgt = level;
          else if (id(sw_force_off).state) tgt = 0.0f;
          id(target_level) = tgt;

          if (id(boot_s) % 30 == 0)
            ESP_LOGI("vent", "duct %.1f C, resting %.1f C, heat>=%.1f cool<=%.1f, %s, speed %.0f%%",
                     t, id(idle_t), id(heat_thr), id(cool_thr), id(running) ? "RUNNING" : "idle", pot * 100);

  # Soft start: move the PWM at most 2 % every 20 ms (0 -> 100 % in 1 s), which
  # keeps the inductor current spike down (see ../sim).
  - interval: 20ms
    then:
      - lambda: |-
          const float step = 0.02f;
          float a = id(actual_level), t = id(target_level);
          if (a < t) a = std::min(t, a + step);
          else if (a > t) a = std::max(t, a - step);
          if (a != id(actual_level)) { id(actual_level) = a; id(pwm_hw).set_level(a); }

  # Status LED, 5 times a second
  - interval: 200ms
    then:
      - lambda: |-
          if (id(blink) > 0) {                         // LEARN feedback: one toggle per tick
            id(blink)--;
            if (id(blink) % 2) id(status_led).turn_on(); else id(status_led).turn_off();
            return;
          }
          if (std::isnan(id(duct_temp).state)) {       // no probe: slow blink
            static int n = 0; n = (n + 1) % 5;
            if (n == 0) id(status_led).turn_on(); else id(status_led).turn_off();
            return;
          }
          if (id(actual_level) > 0.0f) id(status_led).turn_on(); else id(status_led).turn_off();
